<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResourceBox - Free Graphic Design Assets</title>
    <!-- Tailwind CSS for clean layout styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- Official Supabase Library -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Header & Navigation -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black text-indigo-600 tracking-tight cursor-pointer" onclick="filterCategory('All')">ResourceBox</h1>
            
            <!-- Live Search Bar -->
            <div class="w-full sm:w-72">
                <input type="text" id="search-bar" oninput="handleSearch()" placeholder="Search assets (e.g., iPhone, Font)..." class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>
    </header>

    <!-- Dynamic Category Filter Ribbon -->
    <div class="bg-white border-b border-gray-100">
        <div id="category-tags" class="max-w-6xl mx-auto px-4 py-3 flex gap-3 overflow-x-auto text-sm font-medium">
            <!-- Categories will inject here automatically -->
        </div>
    </div>

    <!-- Main Workspace -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-extrabold tracking-tight">Free Premium Design Resources</h2>
            <p class="mt-2 text-lg text-gray-500">High-quality mockups and vectors linked directly to your 5 TB Google Drive storage.</p>
        </div>

        <!-- Dynamic Grid Workspace -->
        <div id="assets-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
            <div class="text-center col-span-full py-12 text-gray-400 font-medium">Connecting to Supabase...</div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
